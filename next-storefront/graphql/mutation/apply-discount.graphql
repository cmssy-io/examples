mutation ApplyDiscount($workspaceId: ID!, $code: String!, $channel: String) {
  cart {
    applyDiscount(workspaceId: $workspaceId, channel: $channel, code: $code) {
      id
      status
      itemCount
      subtotal
      currency
      discountedTotal
      tax
      totalGross
      pricesIncludeTax
      channel
      displayMode
      taxTreatment { kind legalNote buyerVatId buyerVatCountry }
      shippingTotal
      taxSummary { rateId name rate base amount }
      shippingMethod { id label price etaLabel }
      availableShippingMethods { id label price etaLabel }
      appliedDiscount { code type value computedAmount }
      items {
        id
        recordId
        quantity
        variantSelections
        unitPrice
        currentPrice
        priceMismatch
        unit { net gross }
        line { net gross }
        snapshot { name price currency imageUrl sku tiers { minQty price } }
      }
    }
  }
}

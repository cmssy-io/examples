mutation RemoveCartItem($workspaceId: ID!, $itemId: ID!, $channel: String) {
  cart {
    removeItem(workspaceId: $workspaceId, channel: $channel, itemId: $itemId) {
      id
      status
      itemCount
      subtotal
      currency
      discountedTotal
      tax
      totalGross
      amounts { subtotal { gross } discount { gross } shipping { gross } }
      pricesIncludeTax
      channel
      displayMode
      taxTreatment { kind legalNote buyerVatId buyerVatCountry }
      shippingTotal
      taxSummary { rateId name rate base amount }
      shippingMethod { id label price etaLabel }
      availableShippingMethods { id label price etaLabel amount { gross } }
      appliedDiscount { code type value computedAmount }
      items {
        id
        recordId
        quantity
        variantSelections
        unitPrice
        currentPrice
        priceMismatch
        unit { net gross }
        line { net gross }
        snapshot { name price currency imageUrl sku tiers { minQty price } }
      }
    }
  }
}

query PublicModelRecords(
  $workspaceId: String!
  $modelSlug: String!
  $filter: JSON
  $locale: String
  $limit: Int
  $offset: Int
  $sort: String
) {
  public {
    model {
      records(
        workspaceId: $workspaceId
        modelSlug: $modelSlug
        filter: $filter
        locale: $locale
        limit: $limit
        offset: $offset
        sort: $sort
      ) {
        items {
          id
          data
        }
        total
        hasMore
      }
    }
  }
}

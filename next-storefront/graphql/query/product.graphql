query Product(
  $workspaceId: String!
  $modelSlug: String!
  $filter: JSON
  $locale: String
  $previewSecret: String
) {
  public {
    model {
      records(
        workspaceId: $workspaceId
        modelSlug: $modelSlug
        filter: $filter
        locale: $locale
        previewSecret: $previewSecret
        limit: 1
      ) {
        items {
          id
          data
          priceTiers {
            minQty
            price
          }
          variantCount
          variantPriceRange {
            min
          }
          available
          variants {
            id
            sku
            price
            inventory
            tiers {
              minQty
              price
            }
            selectedOptions {
              name
              value
            }
          }
        }
      }
    }
  }
}

query MyOrders($workspaceId: ID!, $skip: Int, $limit: Int, $scope: AccountOrderScope) {
  account {
    orders(workspaceId: $workspaceId, skip: $skip, limit: $limit, scope: $scope) {
      total
      hasMore
      items {
        id
        state
        subtotal
        discount
        appliedDiscount { code type value amount }
        tax
        total
        pricesIncludeTax
        companyName
        channel { key name }
        priceList { name }
        priceListSource
        taxTreatment { kind legalNote buyerVatId buyerVatCountry }
        taxSummary { rateId name rate base amount }
        currency
        customerEmail
        refundedAmount
        paymentStatus
        fulfillmentStatus
        deliveryStatus
        amountPaid
        balanceDue
        shipments { carrier trackingNumber trackingUrl status updatedAt }
        invoiceNumber
        invoiceUrl
        paidAt
        fulfilledAt
        deliveredAt
        createdAt
        orderNumber
        poNumber
        customerNote
        customFields
        shippingTotal
        shippingMethod { id label price }
        shippingAddress { name company line1 line2 postalCode city region country phone vatId }
        items { name price listPrice tierMinQty currency quantity sku }
      }
    }
  }
}

query MyOrder($workspaceId: ID!, $id: ID!) {
  account {
    order(workspaceId: $workspaceId, id: $id) {
      id
      state
      subtotal
      discount
      appliedDiscount { code type value amount }
      tax
      total
      pricesIncludeTax
      companyName
      channel { key name }
      priceList { name }
      priceListSource
      taxTreatment { kind legalNote buyerVatId buyerVatCountry }
      taxSummary { rateId name rate base amount }
      currency
      customerEmail
      refundedAmount
      paymentStatus
      fulfillmentStatus
      deliveryStatus
      amountPaid
      balanceDue
      shipments { carrier trackingNumber trackingUrl status updatedAt deliveredAt items { itemId quantity } }
      returns { id number status requestedAt receivedAt completedAt refundedAmount carrier trackingNumber lines { itemId quantity reason receivedQuantity } }
      invoiceNumber
      invoiceUrl
      paidAt
      fulfilledAt
      deliveredAt
      createdAt
      orderNumber
      poNumber
      customerNote
      customFields
      shippingTotal
      shippingMethod { id label price }
      shippingAddress { name company line1 line2 postalCode city region country phone vatId }
      items { id name price listPrice tierMinQty currency quantity sku }
    }
  }
}

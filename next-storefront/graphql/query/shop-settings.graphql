query ShopSettings($workspaceSlug: String!) {
  public {
    siteConfig(workspaceSlug: $workspaceSlug) {
      id
      lowStockThreshold
      publicCart {
        defaultCurrency
        defaultTaxRateId
        taxRates {
          id
          rate
        }
        shippingMethods {
          enabled
          countries
        }
        orderFields {
          key
          label
          type
          required
          customerCanSet
          description
          options { value label }
          minLength
          maxLength
          minValue
          maxValue
          pattern
        }
      }
    }
  }
}

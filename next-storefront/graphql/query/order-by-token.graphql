query PublicOrder($workspaceId: ID!, $orderId: ID!, $accessToken: String!) {
  public {
    order {
      byToken(workspaceId: $workspaceId, orderId: $orderId, accessToken: $accessToken) {
        id
        orderNumber
        state
        paymentStatus
        fulfillmentStatus
        deliveryStatus
        subtotal
        discount
        appliedDiscount { code type value amount }
        tax
        total
        pricesIncludeTax
        taxSummary { rateId name rate base amount }
        currency
        customerEmail
        poNumber
        customerNote
        customFields
        shippingTotal
        shippingMethod { id label price }
        shippingAddress { name company line1 line2 postalCode city region country phone vatId }
        amountPaid
        balanceDue
        refundedAmount
        shipments { carrier trackingNumber trackingUrl status updatedAt }
        invoiceNumber
        invoiceUrl
        paidAt
        fulfilledAt
        deliveredAt
        createdAt
        items { name price listPrice tierMinQty currency quantity sku taxRate taxAmount }
      }
    }
  }
}

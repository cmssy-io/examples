# Generated by `cmssy types`. Do not edit - it is rewritten on every run.
#
# The delivery reads the SDK itself performs, vendored so your codegen
# types them like any other document. Point `documents` in codegen.ts at
# this file. Need a different selection set? Write your own query, under
# your own operation name - two documents cannot share one.

# Languages, branding and the 404 page - the workspace's settings.
query PublicSiteConfig($workspaceSlug: String!) {
  public {
    siteConfig(workspaceSlug: $workspaceSlug) {
      id
      workspaceId
      siteName
      defaultLanguage
      enabledLanguages
      enabledFeatures
      notFoundPageId
      previewUrl
      branding {
        brandName
        logoUrl
        logoDarkUrl
        faviconUrl
        ogImageUrl
      }
    }
  }
}

# One page with its blocks. `previewSecret` returns the draft.
query PublicPage($workspaceSlug: String!, $slug: String!, $previewSecret: String) {
  public {
    page {
      get(workspaceSlug: $workspaceSlug, slug: $slug, previewSecret: $previewSecret) {
        id
        slug
        pageType
        blocks { id type content style advanced }
        publishedBlocks { id type content style advanced }
      }
    }
  }
}

# One page by id - what the workspace's 404 page setting stores.
query PublicPageById($workspaceSlug: String!, $pageId: ID!) {
  public {
    page {
      getById(workspaceSlug: $workspaceSlug, pageId: $pageId) {
        id
        slug
        pageType
        publishedBlocks { id type content style advanced }
      }
    }
  }
}

# The published page list - sitemaps, and static params.
query PublicPages($workspaceSlug: String!) {
  public {
    page {
      list(workspaceSlug: $workspaceSlug) {
        id
        slug
        updatedAt
        publishedAt
      }
    }
  }
}

# SEO fields for one page, without fetching its blocks.
query PublicPageMeta($workspaceSlug: String!, $slug: String!) {
  public {
    page {
      get(workspaceSlug: $workspaceSlug, slug: $slug) {
        id
        seoTitle
        seoDescription
        seoKeywords
        displayName
      }
    }
  }
}

# Header, footer and the other layout positions for a page.
query PublicPageLayouts($workspaceSlug: String!, $pageSlug: String!, $previewSecret: String) {
  public {
    page {
      layouts(workspaceSlug: $workspaceSlug, pageSlug: $pageSlug, previewSecret: $previewSecret) {
        position
        blocks { id type content style advanced order isActive }
        settings { desktopWidth mobileBehavior }
      }
    }
  }
}

# Records of one model - the typed half of `cmssy types`.
query PublicModelRecords($workspaceId: String!, $modelSlug: String!, $filter: JSON, $sort: String, $locale: String, $limit: Int, $offset: Int, $populate: [String!]) {
  public {
    model {
      records(workspaceId: $workspaceId, modelSlug: $modelSlug, filter: $filter, sort: $sort, locale: $locale, limit: $limit, offset: $offset, populate: $populate) {
        items { id modelId data status createdAt updatedAt }
        total
        hasMore
      }
    }
  }
}

# Records by id - how a relation field resolves to records.
query PublicRecordsByIds($workspaceId: String!, $ids: [String!]!, $locale: String) {
  public {
    model {
      recordsByIds(workspaceId: $workspaceId, ids: $ids, locale: $locale) {
        id modelId data status createdAt updatedAt
      }
    }
  }
}

# A form definition, for rendering and validating it.
query PublicForm($formId: ID!) {
  public {
    form {
      get(formId: $formId) {
        id
        name
        slug
        description
        fields {
          id name fieldType label placeholder helpText
          defaultValue width order showWhen requiredWhen
          options { value label disabled }
          validation { required minLength maxLength minValue maxValue pattern customMessage }
        }
        settings {
          actionType submitButtonLabel successMessage errorMessage
          redirectUrl requireLogin enableCaptcha
        }
      }
    }
  }
}

# Submitting that form - rendering one without this is half a feature.
mutation SubmitForm($formId: ID!, $input: SubmitFormInput!) {
  public {
    form {
      submit(formId: $formId, input: $input) {
        success message submissionId redirectUrl accessToken customer
      }
    }
  }
}

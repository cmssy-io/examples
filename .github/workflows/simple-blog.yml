name: simple-blog

on:
  pull_request:
    branches: [main]
    paths:
      - "simple-blog/**"
      - ".github/workflows/simple-blog.yml"
  push:
    branches: [main]
    paths:
      - "simple-blog/**"
      - ".github/workflows/simple-blog.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: simple-blog

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range in engines.node, because nothing else enforces
        # it: there is no engine-strict anywhere, so the floor is a promise the
        # README makes and no job keeps. 22.13.0 is what pnpm@11.1.2 itself
        # refuses to run below, which is above the floor the dependencies
        # measure; 22 is what Vercel upgrades the build to on its own.
        node: ["22.13.0", "22"]
    steps:
      - uses: actions/checkout@v4

      # `defaults.run.working-directory` applies to `run` steps only, never to
      # `uses` ones - and this action reads packageManager from a path relative
      # to the repository root, which has no package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: simple-blog/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: simple-blog/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Unlike the other two examples this one prerenders the workspace's pages,
      # so the build reads the public demo workspace. The draft secret only has
      # to exist for the draft route to compile - it guards nothing in a build,
      # so a placeholder keeps a real secret out of CI.
      - name: Build against the public demo workspace
        env:
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy-demo
          CMSSY_DRAFT_SECRET: ci-placeholder-not-a-secret
        run: pnpm build

      # A build proves the app compiles and says nothing about whether it knows
      # the blocks the workspace sends - two published demos once served pages
      # where every block came back as an invisible `data-cmssy-unknown-block`
      # over a green build and a 200. `examples.json` has carried the answer for
      # this example since then, and nothing read it: no workflow here ran the
      # script, and the cmssy-sdk job its comment credited does not exist.
      #
      # The paths come from `examples.json`, not from a second copy here. A list
      # that has to be kept equal to another list is the drift this repo keeps
      # finding in blocks; a workflow is no better a place for it.
      - name: The app renders what the workspace sends
        env:
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy-demo
          CMSSY_DRAFT_SECRET: ci-placeholder-not-a-secret
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r path; do paths+=("$path"); done < <(node -e '
            const all = require("../examples.json").examples;
            const one = all.find((e) => e.dir === "simple-blog");
            if (!one?.assertRender?.length) {
              console.error("simple-blog has no assertRender paths in examples.json");
              process.exit(1);
            }
            for (const p of one.assertRender) console.log(p);
          ')
          pnpm start > /tmp/simple-blog-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          # `until`, not `curl ... && break` inside a loop: under `set -e` the
          # failing half of an && list is the body's last command, so the step
          # would die on the first probe, a second into a boot that takes more.
          tries=0
          until curl -sf -o /dev/null "http://localhost:3000${paths[0]}"; do
            tries=$((tries + 1))
            if [ "$tries" -ge 60 ]; then
              echo "::error::the example never answered on ${paths[0]}"
              cat /tmp/simple-blog-server.log
              exit 1
            fi
            sleep 1
          done
          node ../scripts/assert-render.mjs http://localhost:3000 "${paths[@]}"

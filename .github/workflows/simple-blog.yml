name: simple-blog

on:
  pull_request:
    branches: [main]
    paths:
      - "simple-blog/**"
      - ".github/workflows/simple-blog.yml"
      # The assertion step below is driven by these two, so a change to either
      # has to run this job. Without them a PR touching only the shared script
      # or the paths in examples.json changes what CI asserts and runs nothing.
      - "examples.json"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "simple-blog/**"
      - ".github/workflows/simple-blog.yml"
      # The assertion step below is driven by these two, so a change to either
      # has to run this job. Without them a PR touching only the shared script
      # or the paths in examples.json changes what CI asserts and runs nothing.
      - "examples.json"
      - "scripts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: simple-blog

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range in engines.node, because nothing else enforces
        # it: there is no engine-strict anywhere, so the floor is a promise the
        # README makes and no job keeps. 22.13.0 is what pnpm@11.1.2 itself
        # refuses to run below, which is above the floor the dependencies
        # measure; 22 is what Vercel upgrades the build to on its own.
        node: ["22.13.0", "22"]
    steps:
      - uses: actions/checkout@v4

      # `defaults.run.working-directory` applies to `run` steps only, never to
      # `uses` ones - and this action reads packageManager from a path relative
      # to the repository root, which has no package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: simple-blog/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: simple-blog/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # A build proves the app compiles and says nothing about whether it knows
      # the blocks the workspace sends - two published demos once served pages
      # where every block came back as an invisible `data-cmssy-unknown-block`
      # over a green build and a 200. The script builds, serves and asserts,
      # reading all four of `build`, `start`, `port` and `assertRender` from
      # examples.json so that file has one reader and no workflow keeps a second
      # copy of the same list.
      #
      # This example prerenders the workspace's pages, so its build reads the
      # public demo workspace. The draft secret only has to exist for the draft
      # route to compile - it guards nothing here, so a placeholder keeps a real
      # secret out of CI.
      - name: The app renders what the workspace sends
        working-directory: .
        env:
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy-demo
          CMSSY_DRAFT_SECRET: ci-placeholder-not-a-secret
        run: node scripts/serve-and-assert.mjs simple-blog

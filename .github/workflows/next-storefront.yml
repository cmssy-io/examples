name: next-storefront

# GitHub reads workflows only from the repository root. This one arrived here
# as next-storefront/.github/workflows/ci.yml, where it had never run once.
on:
  pull_request:
    branches: [main]
    paths:
      - "next-storefront/**"
      - ".github/workflows/next-storefront.yml"
  # Also on main. A PR that touches no next-storefront file never runs this job, so
  # without a push trigger the branch has no green run of its own - and a
  # required check that can never report blocks such a PR forever.
  push:
    branches: [main]
    paths:
      - "next-storefront/**"
      - ".github/workflows/next-storefront.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next-storefront

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `defaults.run.working-directory` applies to `run` steps only, never to
      # `uses` ones - and this action reads packageManager from a path relative
      # to the repository root, which has no package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: next-storefront/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: next-storefront/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # next-env.d.ts and .next/types are gitignored here, so a fresh checkout
      # has neither and tsc would quietly skip the generated route types. typegen
      # writes them without a full build, which would need CMS credentials this
      # job does not have.
      - run: pnpm typegen
      - run: pnpm typecheck

      # The vendored operations come from the CLI, the app's reads come from the
      # runtime packages, and nothing ties their versions together - the CLI
      # carries its own nested @cmssy/core. Bump one and not the other and the
      # check below compares the file against a version this app no longer runs,
      # and passes.
      - name: The CLI and the runtime SDK are the same version
        run: |
          set -euo pipefail
          version() {
            node -p "JSON.parse(require('fs').readFileSync('node_modules/@cmssy/$1/package.json','utf8')).version"
          }
          cli=$(version cli)
          core=$(version core)
          if [ "$cli" != "$core" ]; then
            echo "::error::@cmssy/cli $cli writes the operations, the app runs @cmssy/core $core - bump both"
            exit 1
          fi
          echo "both on $cli"

      # Both halves of `pnpm types` are committed and both go stale on their
      # own: graphql/models.ts the moment someone edits a model in the CMS - a
      # stale field is a runtime undefined, not a build error - and
      # cmssy/operations.graphql whenever the SDK changes a selection set. The
      # slugs are the public demo workspace's, and the command needs no token.
      - name: Generated types match the workspace and the SDK
        env:
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy-demo
        run: pnpm types --check

      # The app sends the documents in graphql/generated, not the .graphql files
      # the step above checks. Without this, an SDK bump that changes a selection
      # set passes CI while the app keeps sending the old one - the drift the
      # vendored operations exist to remove, moved one file along.
      - name: Generated documents are up to date
        run: |
          pnpm codegen
          # status, not diff: codegen adding a FILE leaves `git diff` empty, and
          # the check would pass on exactly the change it exists to catch.
          if [ -n "$(git status --porcelain -- graphql/generated)" ]; then
            git status --short -- graphql/generated
            echo "::error::run pnpm codegen and commit graphql/generated"
            exit 1
          fi
